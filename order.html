        <section class="contactform">
         <h2> Customize Your Order Here!</h2>
         <br>
            <form id="contact-form">
                <div class="form-group">
                    <label for="fname">First Name</label>
                    <br>
                    <input type="text" id="fname" name="fname" placeholder="Your name" required>
                    <br>
                </div>
                <div class="form-group">
                    <label for="lname">Last Name</label>
                    <br>
                    <input type="text" id="lname" name="lname" placeholder="Your Last name" required>
                    <br>
                </div>
                <div class="form-group">
                <label for="email">Email</label>
                <br>
                <input type="text" id="email" name="email" placeholder="youremail@example.com" required>
                <br>
                </div>
                <div class="form-group">
                <label for="fname">Phone Number</label>
                <br>
                <input type="text" id="num" name="num" placeholder="(123)456-7890" required>
                <br>
                </div>
                <div class="form-group">
                <label for="fname">Event Date</label>
                <br>
                <input type="date" id="eventd" name="eventd" min="2026-11-06" max="2029-11-05" required>
                <br>
                </div>
                <div class="form-group">
                <label for="fname">Desired Quantity</label>
                <br>
                <select id="quan" name="quan" placeholder="Select a Quantity" required>
                    <option>One Dozen (12)</option>
                    <option>One and a Half Dozen (18)</option>
                    <option>Two Dozen (24)</option>
                    <option>Two and a Half Dozen (30)</option>
                    <option>Three Dozen (36)</option>
                    <option>Four Dozen (48)</option>
                    <option>Five Dozen (60)</option>
                    <option>Six Dozen (72)</option>
                    <option>Eight Dozen (96)</option>
                    <option>Ten Dozen (120)</option>
                </select>
                <br>
                </div>
                <div class="form-group">
                <label for="fname">Food Allergies (Optional)</label><br>
                <textarea type="text" id="aller" name="aller" placeholder="Please list any food allergies here (e.g., nuts, gluten, milk)" rows="4" maxlength="1000"></textarea>
                <br>
                </div>
                <div class="form-group">
                <label for="fname">Event and cookie Details</label><br>
                <textarea type="text" id="detail" name="detail" placeholder="Describe your dream cookie and theme!" rows="4" maxlength="1000" required></textarea>
                <br>
                </div>
                <input id="button" type="submit" value="Place Order!">
            </form>
        </section>
        <section class="contactform info" id="contactid">
            <h4>Contact Us Here!</h4>
            <hr>
            <p>For any additional questions, contact us below:</p>
            <br>
            <div class="contact-email">
                <a class="link1" href="mailto:frostandflowercookies@gmail.com">DoughReMi@gmail.com</a>
                <a class="link2" href="tel:+14233556526">(423) 355-6525</a>
            </div>
        </section>
        <footer class="footerinfo">
            <a class="footerbutt" href="https://www.facebook.com/people/Frost-and-Flower/61592701437251/" area-label="Facebook">Facebook Page</a>
        </footer>
    </main>
