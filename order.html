<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order | Dough Re Mi</title>

    <!-- Bootstrap CSS (CDN)-->
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous">
    
    <!--link to custom styles-->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav>
        <a href="main.html" style="margin-right: auto;">
            <img src="images/DoughReMi.png" alt="Dough Re Mi Logo" style="width: 110px;">
        </a>
        <a href="gallery.html">Gallery</a>
        <a href="order.html">Order</a>
        <a href="pricing.html">Pricing</a>
        <a href="specials.html">Specials</a>
    </nav>
    <h1>Order</h1>
    <article class="contactform">
        <h2> Customize Here!</h2>
        <br>
            <form id="contact-form">
                <div class="form-group">
                    <label for="fname">First Name</label>
                    <br>
                    <input type="text" id="fname" name="fname" placeholder="Your name">
                    <br>
                </div>
                <div class="form-group">
                    <label for="lname">Last Name</label>
                    <br>
                    <input type="text" id="lname" name="lname" placeholder="Your Last name">
                    <br>
                </div>
                <div class="form-group">
                <label for="email">Email</label>
                <br>
                <input type="text" id="email" name="email" placeholder="youremail@example.com">
                <br>
                </div>
                <div class="form-group">
                <label for="fname">Phone Number</label>
                <br>
                <input type="text" id="num" name="num" placeholder="(123)456-789">
                <br>
                </div>
                <div class="form-group">
                <label for="fname">Event Date</label>
                <br>
                <input type="date" id="eventd" name="eventd" min="2026-11-06" max="2029-11-05">
                <br>
                </div>
                <div class="form-group">
                <label for="fname">Desired Quantity</label>
                <br>
                <input type="text" id="quan" name="quan" placeholder="Select a Quantity">
                <br>
                </div>
                <div class="form-group">
                <label for="fname">Food Allergies (Optional)</label><br>
                <textarea type="text" id="aller" name="aller" placeholder="Please list any food allergies here (e.g., nuts, gluten, milk)" rows="4" maxlength="1000"></textarea>
                <br>
                </div>
                <div class="form-group">
                <label for="fname">Event and cookie Details</label><br>
                <textarea type="text" id="detail" name="detail" placeholder="Describe your dream cookie and theme!" rows="4" maxlength="1000"></textarea>
                <br>
                </div>
                <input type="submit" value="Place Order!">
            </form>
    </article>
    <main>
        <a href="main.html">&larr; Back to main</a>
    </main>
    <script src="/js/w3c.js"></script>
</body>
</html>
